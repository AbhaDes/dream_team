name: Dream-Team NodeJS CI
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup VM
        uses: actions/setup-node@v7
        with: 
          node-version: 20
      - run: nom install
    