name: Dream-Team NodeJS CI
on:
  push:
    branches:
      - main

jobs:  
  build:
    services:
        postgres:
          image: pgvector/pgvector:pg16 
          env:
            POSTGRES_DB : my_test_db
            POSTGRES_USER: test_user 
            POSTGRES_PASSWORD: test_password         
          ports:
            - 5432:5432          
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5          
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup VM
        uses: actions/setup-node@v7
        with: 
          node-version: 20
      - run: npm install      
      - name: Connect to PostGreSQL      
        run: psql -U test_user -d my_test_db -f db/schema.sql      
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: test_password      
      - run: npm test      
        env:
            DATABASE_URL: "postgres://test_user:test_password@localhost:5432/my_test_db" 
            SESSION_SECRET: sk_test_key

  flask-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r flask_microservice/requirements.txt
      - name: Run pytest
        working-directory: flask_microservice
        run: pytest -v
        env:
          OPENAI_API_KEY: not-a-real-key-the-tests-fake-openai

        

  
    
    