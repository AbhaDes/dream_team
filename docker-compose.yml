version: '3.8'

services:
  web:
    build: .
    ports: 
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    env_file: ##this tell docker to load the .env file and load all the variables into the container's environment
      - .env
    environment:
      # Inside the compose network the database host is the "db" service,
      # overriding the localhost URL in .env used for running node directly.
      DATABASE_URL: postgres://abhadeshpande:mypassword@db:5432/dream_team
      EMBEDDING_SERVICE_URL: http://embeddings:5001

  #The Flask embedding microservice — the API tolerates it being down
  # (profiles save with a null embedding), so web doesn't depend on it.
  embeddings:
    build: ./flask_microservice
    ports:
      - "5001:5001"
    env_file:
      - flask_microservice/.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  #The PostgreSQL container (pgvector build of Postgres 16, same data volume)
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: abhadeshpande
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: dream_team
    ports:
      - "5432:5432"
    volumes:
      - my_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abhadeshpande -d dream_team"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  my_data:
  #the container starts and run node server.js 

  